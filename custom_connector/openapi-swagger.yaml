swagger: '2.0'
info:
  title: NIH All of Us Directory Search
  description: >-
    Finds research and datasets similar to a description the user provides, by
    searching four public sources: the All of Us publication directory and
    research project directory, the IHCC Cohort Atlas (health cohorts), and the
    CCDI Federation (pediatric cancer datasets). Returns ranked matches with a
    source link for each. Call this whenever the user describes a research idea,
    topic, disease, cohort, or dataset and wants to find related work.
  version: '1.1.0'
# After you deploy the Azure Function, replace <FUNCTIONAPP-NAME> with your app
# name (e.g. func-allofus-poc-4821). Host must be public HTTPS.
host: <FUNCTIONAPP-NAME>.azurewebsites.net
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  functionKey:
    type: apiKey
    in: header
    name: x-functions-key
security:
  - functionKey: []
paths:
  /search:
    get:
      summary: Find similar research and datasets
      description: >-
        Search four public sources for work similar to the user's description:
        All of Us publications (~1,400) and research projects (~25,900), IHCC
        health cohorts (~90), and CCDI pediatric-cancer datasets (~300). Returns
        the most likely matches, each with a title and a clickable source url the
        agent must present to the user.
      operationId: searchDirectories
      parameters:
        - name: query
          in: query
          required: true
          type: string
          description: >-
            A natural-language description of the research, topic, disease,
            cohort, or dataset the user is interested in, e.g. "how air pollution
            exposure affects asthma in children".
        - name: directory
          in: query
          required: false
          type: string
          default: all
          enum: [all, publication, project, ihcc, ccdi]
          description: >-
            Which source to search. 'publication' = All of Us published papers,
            'project' = All of Us Researcher Workbench projects, 'ihcc' = IHCC
            health cohorts, 'ccdi' = CCDI pediatric-cancer datasets, or 'all' to
            search every source (default).
        - name: top
          in: query
          required: false
          type: integer
          default: 8
          minimum: 1
          maximum: 25
          description: Number of matches to return (1-25).
      responses:
        '200':
          description: Ranked similar-work matches
          schema:
            type: object
            properties:
              query:
                type: string
              directory:
                type: string
              count:
                type: integer
                format: int32
              results:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    source:
                      type: string
                      description: "One of: publication, project, ihcc, ccdi"
                    record_type:
                      type: string
                      description: "Human label: Publication, Project, Cohort, or Dataset"
                    title:
                      type: string
                    date:
                      type: string
                    journal:
                      type: string
                    institutions:
                      type: string
                    organization:
                      type: string
                      description: Organization for a CCDI dataset.
                    countries:
                      type: array
                      items:
                        type: string
                      description: Countries for an IHCC cohort.
                    diseases:
                      type: array
                      items:
                        type: string
                      description: Diseases studied by an IHCC cohort.
                    data_types:
                      type: array
                      items:
                        type: string
                      description: Data types available in an IHCC cohort.
                    enrollment:
                      type: integer
                      format: int32
                      description: Participant count for an IHCC cohort.
                    authors:
                      type: array
                      items:
                        type: string
                    focus:
                      type: array
                      items:
                        type: string
                    access_tier:
                      type: string
                    citations:
                      type: string
                    snippet:
                      type: string
                      description: Excerpt of the abstract/description for grounding.
                    url:
                      type: string
                      description: Clickable source link the agent must show.
                    score:
                      type: number
                      format: float
                      description: Relevance score (higher = more similar).
        '400':
          description: Missing required query parameter
        '500':
          description: Search error
definitions: {}
