version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/code"
    ignore:
      - dependency-name: "azure-functions"
        versions: [">=2.0.0"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
